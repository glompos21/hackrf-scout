[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hackrf-scout"
version = "0.1.0"
description = "Sweep the whole HackRF range, detect signals, identify them against the SigID Wiki/Artemis database, and store everything in SQLite."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.scripts]
hackrf-scout = "hackrf_scout.cli:main"

[tool.setuptools]
packages = ["hackrf_scout"]
